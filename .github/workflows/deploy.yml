name: Deploy to Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Защита: если сервер зависнет, GitHub принудительно закроет задачу через 10 минут
    timeout-minutes: 10 

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v5

      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          # Правильный параметр тайм-аута для этого экшена (убирает Warning)
          timeout: 30s
          script: |
            cd /opt/neyro-backend
            # Принудительно обновляем код, сбрасывая локальные конфликты git, если они возникнут
            git fetch origin main
            git reset --hard origin main
            # Перезапускаем докер-контейнеры в фоновом режиме с пересборкой
            docker compose down
            docker compose up -d --build
            # Очищаем неиспользуемые старые докер-образы, чтобы не забивать диск сервера
            docker image prune -f
