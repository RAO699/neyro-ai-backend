name: Deploy to Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Защита: если что-то пойдет не так, GitHub сам принудительно закроет задачу через 10 минут
    timeout-minutes: 10 

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v5

      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          # Ограничиваем время ожидания самого SSH-подключения до 30 секунд
          connect_timeout: 30s
          script: |
            cd /opt/neyro-backend
            # Жестко сбрасываем любые локальные изменения на сервере, чтобы избежать конфликтов git
            git fetch origin main
            git reset --hard origin main
            # Перезапускаем контейнеры
            docker compose down
            docker compose up -d --build
            docker image prune -f
