kname: Deploy to Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Защита: автоматическая отмена, если процесс зависнет дольше чем на 10 минут
    timeout-minutes: 10 

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v5

      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          timeout: 30s
          script: |
            cd /opt/neyro-backend
            # Синхронизируем настройки репозитория
            git fetch origin main
            git reset --hard origin main
            # Скачиваем новые образы n8n в фоне, пока старый контейнер ещё работает
            docker compose pull
            # Мгновенно обновляем только изменившиеся контейнеры без полной остановки системы
            docker compose up -d --remove-orphans
            # Удаляем старые версии образов n8n, чтобы не заканчивалось место на диске
            docker image prune -f

