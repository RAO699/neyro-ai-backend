x-logging: &default-logging
  logging:
    driver: "json-file"
    options:
      max-size: "10m"
      max-file: "3"

services:
  nginx:
    image: nginx:1.25-alpine
    container_name: pipeline_nginx
    ports:
      - "80:80"
      - "443:443"
      - "8443:8443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
      - ./ai-assistant:/usr/share/nginx/html/ai-assistant:ro
      - ./.htpasswd:/etc/nginx/.htpasswd:ro
    restart: always
    <<: *default-logging
    deploy:
      resources:
        limits:
          cpus: '0.20'
          memory: 64M
    depends_on:
      n8n:
        condition: service_healthy
    networks:
      - private_net

  postgres:
    image: postgres:15-alpine
    container_name: pipeline_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    <<: *default-logging
    deploy:
      resources:
        limits:
          cpus: '0.40'
          memory: 384M
        reservations:
          memory: 64M
    networks:
      - private_net

  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: pipeline_n8n
    environment:
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=${POSTGRES_DB}
      - DB_POSTGRESDB_USER=${POSTGRES_USER}
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD}
      - N8N_ENCRYPTION_KEY=${N8N_CRYPTO_KEY}
      - N8N_HOST=${DOMAIN_NAME}
      - N8N_PROTOCOL=https
      - WEBHOOK_URL=https://${DOMAIN_NAME}/
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - N8N_RESTRICT_FILE_ACCESS_TO=/generated
      - EXECUTIONS_DATA_SAVE_ON_SUCCESS=all
      - EXECUTIONS_DATA_SAVE_ON_ERROR=all
      - EXECUTIONS_DATA_PRUNE=true
      - EXECUTIONS_DATA_MAX_AGE=7
      - EXECUTIONS_DATA_PRUNE_TIMEOUT=3600
      - N8N_CONCURRENCY_PRODUCTION_LIMIT=20
      - N8N_CONCURRENCY_PRODUCTION_LIMIT_PER_USER=10
      - EXECUTIONS_TIMEOUT=300
      - EXECUTIONS_TIMEOUT_MAX=600
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:5678/healthz || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    volumes:
      - n8n_data:/home/node/.n8n
      - ./ai-assistant/generated:/generated
    restart: always
    <<: *default-logging
    deploy:
      resources:
        limits:
          cpus: '0.40'
          memory: 768M
        reservations:
          memory: 256M
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - private_net

  hash-checker:
    image: python:3.11-alpine
    container_name: pipeline_hashchecker
    environment:
        - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
        - JWT_SECRET=${JWT_SECRET}
        - SENDGRID_API_KEY=${SENDGRID_API_KEY}
        - SENDGRID_FROM=${SENDGRID_FROM}
        - ADMIN_EMAIL=111rao111@gmail.com
    command: sh -c "mkdir -p /app/data && python /app/hash_checker.py"
    volumes:
      - ./hash_checker.py:/app/hash_checker.py:ro
      - hash_checker_data:/app/data
    restart: always
    networks:
      - private_net
    deploy:
      resources:
        limits:
          cpus: '0.05'
          memory: 32M

volumes:
  pg_data:
  n8n_data:
  hash_checker_data:

networks:
  private_net:
    driver: bridge
