events {
    worker_connections 2048;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Глобальный CORS для API
    map $http_origin $cors_origin {
        default "";
        "https://neyro.by" $http_origin;
    }

    # Код ответа при превышении лимита
    limit_req_status 429;

    # Безопасность
    server_tokens off;

    # Увеличенные лимиты для больших файлов (4K апскейл)
    client_max_body_size 50M;
    client_body_timeout 120s;
    client_header_timeout 30s;

    # Прокси-заголовки
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $http_host;

    # Буферы для больших файлов
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;

    # Таймауты
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
    keepalive_timeout 65;

    # Оптимизация
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1000;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=2r/s;
    limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=register_limit:10m rate=1r/m;
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;
    limit_req_zone $binary_remote_addr zone=status_limit:10m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=upload_limit:10m rate=2r/m;
    
    # Редирект HTTP -> HTTPS
    server {
        listen 80;
        server_name _;

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # Основной сервер
    server {
        listen 443 ssl http2;
        server_name _;

        # SSL
        ssl_certificate     /etc/nginx/certs/live.crt;
        ssl_certificate_key /etc/nginx/certs/live.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;

        # Заголовки безопасности
        add_header Strict-Transport-Security "max-age=63072000" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;

        # Лимиты
        limit_conn conn_limit 10;
        limit_req zone=api_limit burst=5 nodelay;

        # Статика сайта
        location / {
            root /usr/share/nginx/html/ai-assistant;
            index index.html;
            try_files $uri $uri/ /index.html;
            expires 7d;
            add_header Cache-Control "public, no-transform, immutable";
        }

        # Сгенерированные изображения
        location /generated/ {
            alias /usr/share/nginx/html/ai-assistant/generated/;

            client_max_body_size 50M;
            send_timeout 120s;

            expires 1d;
            add_header Cache-Control "public, no-transform";
            add_header X-Content-Type-Options "nosniff";

            if ($arg_download = "1") {
                add_header Content-Disposition 'attachment; filename="generated-image.jpg"';
            }

            limit_except GET HEAD {
                deny all;
            }
        }

        # API endpoints - CORS применяется только здесь
        location ~ ^/api/ {
            # CORS заголовки
            add_header Access-Control-Allow-Origin $cors_origin always;
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
            add_header Access-Control-Max-Age "86400" always;
            
            # Preflight запросы
            if ($request_method = 'OPTIONS') {
                return 204;
            }

            # Общие настройки для API
            proxy_set_header Connection "";
            proxy_buffering off;
            client_max_body_size 50M;
        }

        #API регистрации в telegram
        location = /api/telegram-auth {
            proxy_pass http://n8n:5678/webhook/api/telegram-auth;
            proxy_set_header Connection "";
            proxy_read_timeout 30s;
            proxy_buffering on;
            limit_req zone=api_limit burst=5 nodelay;
        }

        # API статуса
        location = /api/user/status {
            proxy_pass http://n8n:5678/webhook/api/user/status;
            proxy_read_timeout 30s;
            proxy_buffering on;
            limit_req zone=api_limit burst=5 nodelay;
            limit_req zone=status_limit burst=3 nodelay;
        }

        # API генерации
        location = /api/generate {
            proxy_pass http://n8n:5678/webhook/api/generate;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
            limit_req zone=api_limit burst=10 nodelay;
        }

        # API апскейла
        location = /api/upscale {
            proxy_pass http://n8n:5678/webhook/api/upscale;
            proxy_read_timeout 180s;
            proxy_send_timeout 180s;
            limit_req zone=api_limit burst=5 nodelay;
        }

        # API редактора объектов
        location = /api/redactor {
            proxy_pass http://n8n:5678/webhook/api/redactor;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            limit_req zone=api_limit burst=5 nodelay;
        }

        # API маски (Segment Anything)
        location = /api/mask {
            proxy_pass http://n8n:5678/webhook/api/mask;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
            limit_req zone=api_limit burst=5 nodelay;
        }

        # API загрузки изображений
        location = /api/upload {
            proxy_pass http://n8n:5678/webhook/api/upload;
            proxy_set_header Connection "";
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
            limit_req zone=upload_limit burst=2 nodelay;
        }

        # Регистрация
        location = /api/register {
            proxy_pass http://n8n:5678/webhook/api/register;
            proxy_read_timeout 30s;
            proxy_buffering on;
            limit_req zone=register_limit burst=2 nodelay;
        }

        # Вход
        location = /api/login {
            proxy_pass http://n8n:5678/webhook/api/login;
            proxy_read_timeout 30s;
            proxy_buffering on;
            limit_req zone=login_limit burst=3 nodelay;
        }

        # Подтверждение оплаты
        location = /api/confirm-payment {
            proxy_pass http://n8n:5678/webhook/api/confirm-payment;
            proxy_read_timeout 30s;
            proxy_buffering on;
            limit_req zone=api_limit burst=5 nodelay;
        }

        # API обратной связи
        location = /api/feedback {
            if ($request_method = 'OPTIONS') {
                add_header Access-Control-Allow-Origin $cors_origin always;
                add_header Access-Control-Allow-Methods "POST, OPTIONS" always;
                add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
                add_header Access-Control-Max-Age "86400" always;
                add_header Content-Length 0;
                add_header Content-Type text/plain;
                return 204;
            }

            proxy_pass http://n8n:5678/webhook/api/feedback;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_read_timeout 30s;
            proxy_buffering on;
            limit_req zone=api_limit burst=3 nodelay;
        }

        # Привязка аккаунта
        location = /api/link-account {
            proxy_pass http://n8n:5678/webhook/api/link-account;
            proxy_read_timeout 30s;
            proxy_buffering on;
        }

        # Админские функции
        location /admin/ {
            auth_basic "Admin Area";
            auth_basic_user_file /etc/nginx/.htpasswd;
            proxy_pass http://n8n:5678/webhook/admin/;
            proxy_set_header Connection "";
            proxy_read_timeout 60s;
            proxy_buffering on;
        }

        # Webhook Telegram
        location = /webhook/telegram {
            allow 91.108.4.0/22;
            allow 149.154.160.0/20;
            deny all;
            proxy_pass http://n8n:5678/webhook/telegram;
            proxy_set_header Connection "";
            proxy_read_timeout 30s;
            proxy_buffering off;
        }

        # API восстановления пароля
        location = /api/request-reset {
            proxy_pass http://hash-checker:5000/request-reset;
            proxy_set_header Content-Type "application/json";
            proxy_read_timeout 30s;
        }

        # API верификации e-mail
        location = /api/verify-email {
            proxy_pass http://n8n:5678/webhook/api/verify-email;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
            proxy_buffering on;
            limit_req zone=api_limit burst=5 nodelay;
        }

        # API отпавки кода
        location = /api/send-verification-code {
            proxy_pass http://hash-checker:5000/send-verification-code;
            proxy_set_header Content-Type "application/json";
            proxy_read_timeout 30s;
            limit_req zone=api_limit burst=5 nodelay;
        }
        
        # Проверка в hash-checker
        location = /api/confirm-reset {
            proxy_pass http://hash-checker:5000/confirm-reset;
            proxy_set_header Content-Type "application/json";
            proxy_read_timeout 30s;
        }
        
        # Обновление пароля в БД
        location = /api/reset-password {
            proxy_pass http://n8n:5678/webhook/api/reset-password;
            proxy_set_header Connection "";
            proxy_read_timeout 30s;
        }

        # Блокировка скрытых файлов
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }
    }

    # Редактор n8n (приватный)
    server {
        listen 8443 ssl http2;
        server_name _;

        ssl_certificate     /etc/nginx/certs/live.crt;
        ssl_certificate_key /etc/nginx/certs/live.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;

        # Телеметрия без пароля
        location /rest/telemetry/ {
            auth_basic off;
            proxy_pass http://n8n:5678;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
            proxy_buffering off;
        }

        # API n8n (без basic auth, используется API key)
        location /api/ {
            auth_basic off;
            proxy_pass http://n8n:5678;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
            proxy_buffering off;
        }

        # WebSocket для редактора
        location /ws/ {
            auth_basic "Restricted Access";
            auth_basic_user_file /etc/nginx/.htpasswd;
            proxy_pass http://n8n:5678;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_read_timeout 86400s;
        }

        # Всё остальное с паролем
        location / {
            auth_basic "Restricted Access";
            auth_basic_user_file /etc/nginx/.htpasswd;
            proxy_pass http://n8n:5678;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
            proxy_buffering off;
        }
    }
}
