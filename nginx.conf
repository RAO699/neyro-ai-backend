events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Редирект HTTP -> HTTPS
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # Основной сервер (статический сайт + API + сгенерированные файлы + Telegram webhook)
    server {
        listen 443 ssl;
        server_name _;

        ssl_certificate     /etc/nginx/certs/live.crt;
        ssl_certificate_key /etc/nginx/certs/live.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        # Статика сайта
        location / {
            root /usr/share/nginx/html/ai-assistant;
            index index.html;
            try_files $uri $uri/ /index.html;
            expires 7d;
            add_header Cache-Control "public, no-transform";
        }

        # Сгенерированные изображения (отображение + скачивание по ?download=1)
        location /generated/ {
            alias /usr/share/nginx/html/ai-assistant/generated/;
            expires 7d;
            add_header Cache-Control "public, no-transform";
            if ($arg_download = "1") {
                add_header Content-Disposition 'attachment; filename="generated-image.jpg"';
            }
        }

        # API статуса пользователя
        location = /api/user/status {
            proxy_pass http://n8n:5678/webhook/api/user/status;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_read_timeout 60s;
            proxy_buffering off;
        }

        # API генерации
        location /api/generate {
            proxy_pass http://n8n:5678/webhook/api/generate;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_read_timeout 600s;
            proxy_buffering off;
        }

        # API начисления кредитов (защищён паролем)
        location /admin/add-credits {
            auth_basic "Admin Area";
            auth_basic_user_file /etc/nginx/.htpasswd;
            proxy_pass http://n8n:5678/webhook/admin/add-credits;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_read_timeout 60s;
            proxy_buffering off;
        }

        # Webhook для Telegram бота
        location /webhook/telegram {
            proxy_pass http://n8n:5678/webhook/telegram;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_read_timeout 60s;
            proxy_buffering off;
        }
    }

    # Редактор n8n (защищён паролем, кроме телеметрии)
    server {
        listen 8443 ssl;
        server_name _;

        ssl_certificate     /etc/nginx/certs/live.crt;
        ssl_certificate_key /etc/nginx/certs/live.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        # Телеметрия n8n — без пароля
        location /rest/telemetry/ {
            auth_basic off;
            proxy_pass http://n8n:5678;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
            proxy_buffering off;
        }

        # Всё остальное (редактор) — с паролем
        location / {
            auth_basic "Restricted Access";
            auth_basic_user_file /etc/nginx/.htpasswd;
            proxy_pass http://n8n:5678;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
            proxy_buffering off;
        }
    }
}
